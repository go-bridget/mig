- name: event
  comment: Core event table for distributed job queue system
  columns:
    - name: id
      comment: Unique event identifier
      datatype: bigint
      size: 8
    - name: title
      comment: Event title or job name
      datatype: varchar
      size: 255
    - name: description
      comment: Detailed event description
      datatype: text
    - name: tags
      comment: Comma-separated tags for routing
      datatype: text
    - name: status
      comment: Current event state
      datatype: enum
      values:
        - COMPLETED
        - FAILED
        - PENDING
        - PROCESSING
    - name: payload
      comment: Event payload with job-specific data
      datatype: jsonb
    - name: retry_count
      comment: Number of failed attempts
      datatype: int
      size: 4
    - name: max_retries
      comment: Maximum allowed retry attempts
      datatype: int
      size: 4
    - name: next_retry_at
      comment: When to retry after failure
      datatype: timestamp
    - name: created_at
      comment: Event creation timestamp
      datatype: timestamp
    - name: updated_at
      comment: Last update timestamp
      datatype: timestamp
  indexes:
    - columns:
        - id
      primary: true
      unique: true
    - columns:
        - next_retry_at
    - columns:
        - status
    - columns:
        - tags
- name: event_log
  comment: Audit trail of worker actions on events
  columns:
    - name: id
      comment: Log entry identifier
      datatype: bigint
      size: 8
    - name: event_id
      comment: Reference to event
      datatype: bigint
      size: 8
    - name: worker_id
      comment: Unique worker identifier
      datatype: varchar
      size: 255
    - name: action
      comment: Action performed PICKED STARTED COMPLETED FAILED
      datatype: varchar
      size: 50
    - name: status_code
      comment: HTTP-like status code for outcome
      datatype: int
      size: 4
    - name: error_message
      comment: Error details if action failed
      datatype: text
    - name: execution_time_ms
      comment: Milliseconds taken to execute
      datatype: int
      size: 4
    - name: created_at
      comment: When action occurred
      datatype: timestamp
  indexes:
    - columns:
        - id
      primary: true
      unique: true
    - columns:
        - created_at
    - columns:
        - event_id
    - columns:
        - worker_id
- name: migrations
  comment: Migration log of applied migrations
  columns:
    - name: project
      comment: Microservice or project name
      datatype: varchar
      size: 16
    - name: filename
      comment: yyyy-mm-dd-HHMMSS.sql
      datatype: varchar
      size: 255
    - name: statement_index
      comment: Statement number from SQL file
      datatype: int
      size: 4
    - name: status
      comment: ok or full error message
      datatype: text
  indexes:
    - columns:
        - project
        - filename
      primary: true
      unique: true
