- name: event
  comment: Event
  columns:
    - name: id
      comment: ID
      datatype: bigint
      size: 8
    - name: title
      comment: Title
      datatype: varchar
    - name: description
      comment: Description
      datatype: varchar
    - name: tags
      comment: Tags
      datatype: varchar
    - name: status
      comment: Status
      datatype: varchar
      values:
        - COMPLETED
        - FAILED
        - PENDING
        - PROCESSING
    - name: payload
      comment: Payload
      datatype: varchar
    - name: retry_count
      comment: Retry Count
      datatype: bigint
      size: 8
    - name: max_retries
      comment: Max Retries
      datatype: bigint
      size: 8
    - name: next_retry_at
      comment: Next Retry At
      datatype: timestamp
    - name: created_at
      comment: Created At
      datatype: timestamp
    - name: updated_at
      comment: Updated At
      datatype: timestamp
  indexes:
    - columns:
        - id
      primary: true
      unique: true
    - columns:
        - next_retry_at
    - columns:
        - status
    - columns:
        - tags
- name: event_log
  comment: Event Log
  columns:
    - name: id
      comment: ID
      datatype: bigint
      size: 8
    - name: event_id
      comment: Event ID
      datatype: bigint
      size: 8
    - name: worker_id
      comment: Worker ID
      datatype: varchar
    - name: action
      comment: Action
      datatype: varchar
    - name: status_code
      comment: Status Code
      datatype: bigint
      size: 8
    - name: error_message
      comment: Error Message
      datatype: varchar
    - name: execution_time_ms
      comment: Execution Time Ms
      datatype: bigint
      size: 8
    - name: created_at
      comment: Created At
      datatype: timestamp
  indexes:
    - columns:
        - id
      primary: true
      unique: true
    - columns:
        - created_at
    - columns:
        - event_id
    - columns:
        - worker_id
- name: migrations
  comment: Migrations
  columns:
    - name: project
      comment: Project
      datatype: varchar
    - name: filename
      comment: Filename
      datatype: varchar
    - name: statement_index
      comment: Statement Index
      datatype: bigint
      size: 8
    - name: status
      comment: Status
      datatype: varchar
  indexes:
    - columns:
        - project
        - filename
      primary: true
      unique: true
